# Netlify — site 100% estático (HTML/JS/CSS/imagens/áudios/vídeos locais)
# Publique arrastando a pasta em app.netlify.com ou conectando o repositório.
# Os redirects estão no arquivo _redirects (lido automaticamente pelo Netlify).

[build]
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Cada rota já existe como arquivo estático real:
#   /            -> index.html
#   /jogar       -> jogar/index.html
#   /login       -> login/index.html
#   /cadastro    -> cadastro/index.html
#   /roleta      -> roleta/index.html
#   /bonus       -> bonus/index.html
#   /termos      -> termos/index.html
#   /gerente/*   -> 307 para /gerente/login (ver _redirects)
# A 404.html é servida automaticamente para rotas inexistentes.
