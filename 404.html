<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131413">
<title>404 — SnakeWin</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:#131413;color:#fff;text-align:center;padding:24px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .code{font-size:76px;font-weight:900;line-height:1;background:linear-gradient(180deg,#4dfbc8,#12b981);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{margin:0;font-size:22px}
  p{margin:0;color:rgba(255,255,255,.62);max-width:420px;line-height:1.5;font-size:15px}
  .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  a.btn{display:inline-block;text-decoration:none;font-weight:800;font-size:15px;padding:13px 26px;border-radius:14px;
    background:linear-gradient(155deg,#3fe06b,#0e7a33);color:#04120a;box-shadow:0 8px 24px rgba(63,224,107,.28)}
  a.btn.ghost{background:rgba(255,255,255,.10);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
  a.btn:active{transform:scale(.97)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:.02em;font-size:17px}
  .dot{width:9px;height:9px;border-radius:50%;background:#4dfbc8;box-shadow:0 0 12px #4dfbc8}
</style>
</head>
<body>
  <div class="brand"><span class="dot"></span> SnakeWin</div>
  <div class="code">404</div>
  <h1>Página não encontrada</h1>
  <p>O endereço que você tentou abrir não existe ou foi movido. Volte para o início e continue jogando.</p>
  <div class="actions">
    <a class="btn" href="/">Acessar agora</a>
    <a class="btn ghost" href="/jogar">Ir para Jogar</a>
  </div>
</body>
</html>
